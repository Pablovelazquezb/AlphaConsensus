[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaconsensus"
version = "0.1.0"
description = "Consensus-driven paper-trading research pipeline over curated X/Twitter accounts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pablo Velazquez" }]
dependencies = []

[project.optional-dependencies]
# Core pipeline runs on the standard library only. Extras are optional.
prices = ["yfinance>=0.2.40"]
llm = ["httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
alphaconsensus = "alphaconsensus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
